# Taxonomía Estándar de Productos - AIPDP (versión extendida)
fields:
  - name: codigo
    data_type: string
    required: true
    description: "Código interno o SKU del producto"
    aliases:
      - "artículo"
      - "sku"
      - "cod"
      - "item"
      - "referencia"
      - "código"
      - "codigo"
      - "code"

  - name: nombre_articulo
    data_type: string
    required: true
    description: "Nombre corto o título del producto"
    aliases:
      - "nombre"
      - "denominación"
      - "producto"
      - "descripción corta"
      - "nombre articulo"
      - "titulo"

  - name: descripcion
    data_type: string
    required: false
    description: "Descripción larga o detalle técnico"
    aliases:
      - "detalle"
      - "descripción larga"
      - "observaciones"
      - "descripcion"
      - "description"
      - "descripción"

  # 🆕 NUEVO CAMPO: Dimensiones (separado de descripcion para evitar colisiones)
  - name: dimensiones
    data_type: string
    required: false
    description: "Dimensiones, medidas, tamaño o especificaciones numéricas del producto (ej. 13mm, 100x50cm, 1/2\")"
    aliases:
      - "medidas"
      - "tamaño"
      - "talla"
      - "proporciones"
      - "dimension"
      - "tam"
      - "medida"
      - "especificaciones"
      - "especificación"

  - name: marca
    data_type: string
    required: false
    description: "Marca o fabricante"
    aliases:
      - "fabricante"
      - "brand"
      - "marca"

  - name: modelo
    data_type: string
    required: false
    description: "Modelo del producto"
    aliases:
      - "modelo"
      - "model"

  - name: categoria
    data_type: string
    required: false
    description: "Categoría o familia del producto"
    aliases:
      - "categoría"
      - "categoria"
      - "family"
      - "familia"
      - "category"

  - name: precio_lista
    data_type: float
    required: true
    description: "Precio de lista sin descuentos"
    aliases:
      - "precio"
      - "pvp"
      - "list price"
      - "p. lista"
      - "precio neto"
      - "precio de lista $ars"
      - "precio de lista"
      - "costo neto a ferreterias"
      - "precio promocional"
      - "precio lista"
      - "precio neto"

  - name: precio_sugerido
    data_type: float
    required: false
    description: "Precio sugerido con IVA incluido"
    aliases:
      - "precio sugerido"
      - "precio sugerido iva incluido"
      - "precio con iva"
      - "suggested price"
      - "precio final"
      - "precio venta"

  - name: precio_2
    data_type: float
    required: false
    description: "Precio en cuotas (ej. hasta 6 cuotas)"
    aliases:
      - "precio sugerido hasta 6 cuotas 13.8%"
      - "precio 6 cuotas"
      - "precio cuotas"
      - "precio hasta 6 cuotas"

  - name: precio_3
    data_type: float
    required: false
    description: "Precio en más de 6 cuotas"
    aliases:
      - "precio sugerido más de 6 cuotas 35%"
      - "precio +6 cuotas"
      - "precio más cuotas"

  - name: iva
    data_type: float
    required: false
    description: "Tasa de IVA (ej. 21.0 para 21%)"
    aliases:
      - "iva %"
      - "impuesto"
      - "tax"
      - "% iva"
      - "iva"
      - "tasa iva"

  - name: ean
    data_type: string
    required: false
    description: "Código de barras EAN-13"
    aliases:
      - "ean13"
      - "código barras"
      - "upc"
      - "ean"
      - "gtin"

  - name: moneda
    data_type: string
    required: false
    description: "Moneda del precio (USD, EUR, ARS, etc.)"
    aliases:
      - "currency"
      - "$"
      - "moneda"
      - "divisa"

  - name: unidad_medida
    data_type: string
    required: false
    description: "Unidad de medida o empaque (kg, m, un, mg, caja, rollo, etc.)"
    aliases:
      - "unidad"
      - "medida"
      - "empaque"
      - "unit"
      - "unidad de medida"
      - "u.m"
      - "medida"
      - "presentación"

  - name: hoja_origen
    data_type: string
    required: false
    description: "Nombre de la hoja de origen (para archivos con múltiples hojas)"
    aliases: []
